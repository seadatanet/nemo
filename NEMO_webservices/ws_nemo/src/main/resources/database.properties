# Si la base de donnée est définie par une ressource jndi, spécifier son nom
#jndi.resourcename=SISMER

# Configuration JDBC
# Les valeurs ${...} sont des placeholders résolus au démarrage depuis :
#   - les variables d'environnement (Docker, Ansible, CI)
#   - les propriétés système Java (-DNEMO_DB_URL=...)
# En développement local : définir ces variables dans .vscode/tasks.json

jdbc.driverclassname=oracle.jdbc.driver.OracleDriver
jdbc.url=${NEMO_DB_URL}
jdbc.username=${NEMO_DB_USERNAME}
jdbc.password=${NEMO_DB_PASSWORD}
jdbc.pool.min=2
jdbc.pool.max=4
