aboutText=\nNEMO : ODV - NetCDF - Medatlas Converter\n\
\n\
Version: 1.7.3\n\
\n\
(c) Copyright IFREMER - http://www.ifremer.fr\n\
\n\
Change log : \n\
\n\
- 1.7.3 - 2022/01/14\n\
Bugs corrections:\n\
\t. Fix problems with CSV-type input file while trying to convert them in MEDATLAS.\n\
\t. Update log4j to version 2.17.1 (security issue).\n\
\t. Include Octopus 1.7.1 libraries taking into account the Log4j security issue.\n\
\t. Fix sorting problems for ODV and MEDATLAS trajectories.\n\
\n\
- 1.7.2 - 2021/10/14\n\
Adds-on:\n\
\t. Use of the new "BODV" and "MODV" format names in coupling table.\n\
Bugs corrections:\n\
\t. Change Ifremer cruises web services (RESTful now).\n\
\t. possibility to have a unique LOCAL_CDI_ID for managing shipborn ADCP data (unique LOCAL_CDI_ID for the whole trajectory).\n\
\t. Change memory handling to prevent some crashes with big files.\n\
\t. Fix typos.\n\
\n\
- 1.7.1 - 2021/02/05\n\
Adds-on:\n\
\t. The use of the argument -cruiseComment in batch mode will fulfil the DATASET_ABS field of the CDI_summary file for MIKADO\n\
Bugs corrections:\n\
\t. Fix regression for '-datasetRef' option in batch mode\n\
\n\
- 1.7.0 - 2020/03/15\n\
Adds-on:\n\
\t. Support for ODV biological, flowcytometry, microlitter variants formats\n\
\t. Possibility to have multiple parameters that have the same P01\n\
\t. Vocabulary lists can now be updated via the batch\n\
\t. Possibility to use separators in station headers\n\
\t. Possibility to add cruise name, ship code, cruise comment, and local CSR identifier or BSH CSR reference as arguments in Nemo Batch\n\
\t. New data termination indicator type for csv files: change of value in a given column\n\
\t. ISO and Julian formats accepted for date in Station description\n\
\t.  Possibility to input manually the data type in station description\n\
\t.  Possibility to input a date parameter in data description\n\
\t.  Update EDMO web services URL in settings\n\
\t.  Update URLs for CDIs, CSRs and NERC vocabularies\n\
Bug corrections concerning:\n\
\t. Fix error when setting time manually for a timeseries\n\
\t. Fix label errors in FR\n\
\t. Fix error with some NA values\n\
\t. Fix out of memory error with big files with separators: increase max memory allocation to 2048Mo and limit data display to 100 lines in the data tab\n\
\t. Use unit XXXX instead of UUUU for text parameters\n\
\t. Fix non validated models backup for data tab\n\
\n\
- 1.6.7 - 2019/01/21\n\
Adds-on:\n\
\t. Possibility to use a BSH CSR reference in a SDN reference: \n\
\t. Improve flags scales window in Nemo settings\n\
\t. New coordinates format in station folder: "decimal degrees for file with separators"\n\
\t. Use -99999 as fill value in SDN NetCDF output files\n\
\t. Add a new SDN QC flag: Q (value below limit of quantification)\n\
\t. Update SeaDataNet CSR XML Schema (4.0.0)\n\
Bug corrections concerning:\n\
\t. Java >=9 compatibility\n\
\t. NEMO did not start when version service was unreachable\n\
\t. In Data tab, bad input flags values for CSV files\n\
\t. Incorrect whitespaces in ODV output files\n\
\t. Data columns width improvement in data tab\n\
\t. Allow user to go back to manual input for date and time once automatic input has been chosen\n\
\t. Missing ships in Cruise tab list (in case of ships having the same name)\n\
\n\
- 1.6.6 - 2017/11/22\n\
Bug corrections concerning:\n\
\t. NEMO did not start when version service was unreachable\n\
\t. In Data tab, bad input flags values for CSV files\n\
\n\
- 1.6.5 - 2017/09/27\n\
Bug corrections concerning:\n\
\t. On the data screen for CSV files, incorrect synchronisation of highlighting between the data table and the parameter table\n\
\t. In Data tab: incorrect test on P06 unit for non numeric parameters\n\
\n\
- 1.6.4 - 2017/08/23\n\
Bug corrections concerning:\n\
\t. Error on data format in data tab for big integers and floats (33045+37151) \n\
\t. Station number in trajectories: force the use of incremental number because the read of a number in the station header was not possible and generated bug (30829)\n\
\t. MedATLAS and CFPoint time series conversions: fix date computing using user offset (33044)\n\
\t. MedATLAS conversion for time series with multiple stations: fix start date and sampling rate for stations 1+N (36265 + 36463)\n\
\t. MedATLAS conversion for time series with multiple stations not ordered by date with station number incremented: fix stations end date (36265)\n\
\t. ODV conversion for profiles with pressure and no depth: fix bug if pressure format in Data tab is integer type (36176)\n\
\t. CFPoint conversion: sort data within stations if sort option is checked (36668)\n\
\t. ODV conversion: fix ISO date time columns headers\n\
\t. CFPoint conversions: improve process time\n\
\t. CFPoint: fix SDN_CRUISE start_date and end_date attributes formats: write only date, not time, using YYYY-MM-DD format.\n\
\t. In Data tab, when using P01 via P09, use unit label coming from P09-P06 mapping instead of P09 one (25794)\n\
Adds-on:\n\
\t. In Data tab, use table to display and select parameters for input CSV files (33278)\n\
\t. Detect deprecated or non existing BODC terms in Cruise, Station and Data tabs (GUI and batch modes). Deprecated terms are automatically replaced if a replacement code is given by the BODC.\n\
\t. Check of the software version\n\
\n\
- 1.6.3 - 2016/05/19\n\
Bug corrections concerning:\n\
\t. Error on date and times for conversion of trajectories if dates and times are read in input file\n\
\t. Error on title in L22 selection window \n\
\n\
- 1.6.2 - 2016/01/04\n\
Bug corrections concerning:\n\
\t. Error on files containing textual data and using P01 via P02 BODC parameters\n\
\t. Summary_cdi_nemo.xml file \n\
\t. Stations order in output files: sort by date and then by station number \n\
Adds-on:\n\
\t. Improve parameters/units selection tables \n\
\n\
- 1.6.1 - 2015/07/15\n\
Bug corrections concerning:\n\
\t. Coupling table (bug on import and edition) \n\
\n\
- 1.6.0 - 2015/06/08\n\
Bug corrections concerning:\n\
\t. fix P06 code used for non numeric ODV data units: use UUUU instead of incorrect UKNW\n\
\t. Sort data within stations by increasing reference parameter: fix sort order (numerical instead of alphabetical)\n\
\t. Fix Coupling table update in batch mode\n\
\t. wrong station numbers for trajectories collections conversion in netcdf\n\
\t. generation error when adding a parameter in data tab after a first conversion\n\
\t. CFPoint conversion of timeseries with start date and sampling rate\n\
\t. wrong default flag on TIME variable in CFPoint\n\
Adds-on:\n\
\t. Seadatanet references: Nemo adds automatically SDN references about CDI, CSR (if local CSR Identifier is set in the Cruise tab), SHIP (if Ship is set in the Cruise tab).Cruise tab is now always displayed and renamed Cruise/Collection. In ODV, the cruise name is used in Cruise column if exists (otherwise Cruise reference is used)\n\
\t. SDN Mapping new attributes "instrument" and "fall_rate" are available from Data tab\n\
\t. MEDATLAS: allow DEPH as primary variable for vertical profiles\n\
\t. Allow Server Initialisation and XML Initialisation for ODV conversions (Cruise tab)\n\
\t. ODV with textual data: column headers using "INDEXED_TEXT"\n\
\n\
- 1.5.4 - 2014/06/06\n\
Bug corrections concerning:\n\
\t. Empty ship list in Cruise tab on Linux \n\
\t. Fix label for Conventions global attribute "SeaDataNet_1.0 CF 1.6" instead of "SeaDataNet_1.0 CF-1.6"\n\
\t. NetCDF CFPoint generated files: Translate units from en-GB to en-US in Units variable attributes (eg. "metre" to "meter") \n\
\n\
- 1.5.3 - 2014/03/31\n\
Bug corrections concerning:\n\
\t. Edmo choice in Nemo settings improved (faster and easier)\n\
\t. Data section poorly updated on change in existing model\n\
\t. Missing the last line with the default values in some particular cases of MEDATLAS Format\n\
\t. Revision of the attributes of SDN_CRUISE for collection of Cruises in NetCDF Format\n\
Adds-on:\n\
\t. Capability of reading CSR ISO-19139  in tab Cruise\n\
\t. SDN mapping generation: conversion is cancelled if mapping for a parameter or a unit is not found\n\
\n\
-1.5.2 - 2013/09/16\n\
Adds-on:\n\
\t. FORMAT_VERSION for CDI-SUMMARY\n\
Bug corrections concerning:\n\
\t. relative coupling table path\n\
\n\
- 1.5.1 - 2013/07/18\n\
Adds-on:\n\
\t. change C16 to C19 List with Backwards Compatible model\n\
\n\
- 1.5.0 - 2013/07/18\n\
Adds-on:\n\
\t. Possibility to convert file into NetCDF format\n\
\t. Compliancy with version V2 of BODC vocabularies\n\
\t. Possibility to use Above Sea Level measure\n\
\n\
- 1.4.5 - 11/07/2012\n\
Bug corrections concerning:\n\
\t. End date of time series with not constant sampling rate\n\
\t. Address of the file in the coupling table\n\
\t. Default value in ODV format\n\
\n\
- 1.4.4 - 21/03/2012\n\
Update:\n\
\t. Possibility to use non-numeric parameters (\u00A76.4)\n\
\t. Time series with non-constant sampling rate supported\n\
\n\
- 1.4.3 - 24/01/2012\n\
Update:\n\
\t. Possibility to keep previous installation preferences while reinstalling NEMO (\u00A72.1.1)\n\
\t. Possibility to save uncompleted model (\u00A76.6)\n\
\t. New example for batch mode script file (\u00A76.8)\n\
\t. Several input and output files for trajectories\n\
\t. Mandatory fields marked by a '*' on the input  screens\n\
\t. Data description: output default value not  mandatory for ODV format \n\
\n\
- 1.4.0 - 12/05/2011\n\
Updates:\n\
\t. user label column in parameters table\n\
\t. File backup (\u00A72)\n\
\t. Column usage (\u00A76.4.2.4)\n\
\t. data termination indicator (\u00A76.1)\n\
\t. Change in the  menu of table of measurements (\u00A76.4.1):\n\
\t\t. Select a format\n\
\t\t. Move current parameter up to top\n\
\t\t. move current parameter down to bottom\n\
\t. More arguments in batch mode (\u00A76.8.1):\n\
\t\t. couplingTableUpdate \n\
\t\t. coupingTablePrefix\n\
\n\
- 1.3.0 - 18/02/2011\n\
Major Update: \n\
\t. P011 available through P021\n\
\t. New parameter lists(\u00A76.4.2)\n\
\t. Choice of conversion format moved to File tab (\u00A75.7)\n\
\t. Modification in Station tab, Depth section (\u00A76.3.1)\n\
\t. Modification of the Data tab (\u00A76.4)\n\
\t. Modification of the Convert Tab (\u00A76.5.1)\n\
\t. Note of parameters automatically inserted by NEMO (\u00A76.5.2)\n\
\t. Batch mode - new arguments for CDI summary and coupling table generation (\u00A76.8)\n\
\n\
- 1.2.25 - 25/05/2010\n\
Update :\n\
\t. Global validation of all NEMO steps : page 19\n\
\t. Batch mode for NEMO : page 55, 56\n\
\t. Use of P011 parameter codes : page 22, 46, 47\n\
\t. Default value for bottom depth : page 40\n\
\t. Default value for station start time : page38\n\
\t. NEMO settings : choose the default quality flag : page 26\n\
\t. Corrections of several anomalies\n\
\t. Source code rewriting to take into account the conversion of big files (several thousands of stations) : modification of the way of converting files.\n\
\n
